; Oregon Trail Accessibility Mod settings.
; Most of these can also be changed in game with the function keys.
; Note: the mod rewrites this file when you change a setting in game,
; so these comments disappear after the first change.

[speech]
; Windows SAPI voice speed, -10 to 10 (F12 faster, Shift+F12 slower)
rate=2
; part of a voice name to use, for example Zira or David (blank = Windows default voice)
voice=

[sound]
; river sound while rafting (0 = off) and its volume, 0-100
water=1
water_volume=35
; tones when entering and leaving a text box (0 = off) and their volume
cues=1
cue_volume=45

[travel]
; 0 = continuous, 1 = day by day, 2 = never pause for events (F9 cycles)
mode=0
; pause travel while a new trail message is read
pause_on_events=1
auto_resume=1
; speak the date and distance every day (F11)
daily_reports=0

[hunting]
; seconds per hunt (the game's own choices are 20 to 120)
time_seconds=120
; steer bullets toward the chosen animal
aim_assist=1
; let automatic hunting shoot rabbits and squirrels too
auto_small_game=0
latency_ms=60

[rafting]
; steer around the rocks automatically (A toggles while rafting)
auto_steer=1

[window]
; bring the mod window back in front after DOSBox opens
keep_focus=1

[dosbox]
; full path to dosbox.exe if it is not found automatically
path=
; CPU cycles, e.g. 20000 (blank = DOSBox default)
cycles=

[game]
; game folder (blank = "Game Files" next to OTAccess.exe)
folder=
